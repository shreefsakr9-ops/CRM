name: CI

on:
  push:
    branches: [main]
  pull_request:

# إلغاء التشغيل السابق تلقائيًا عند دفع commit جديد على نفس الفرع.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # الاختبارات تعمل على قاعدة بيانات منفصلة تمامًا (نفس سلوك بيئة التطوير).
  DATABASE_URL: postgresql://bluepoint:bluepoint@localhost:5432/bluepoint_ci?schema=public
  TEST_DATABASE_URL: postgresql://bluepoint:bluepoint@localhost:5432/bluepoint_ci?schema=public
  # أسرار وهمية للـ CI فقط — الأسرار الحقيقية لا تُوضع في المستودع إطلاقًا.
  SESSION_SECRET: ci-only-session-secret-not-used-in-any-real-environment
  FILE_SIGNING_SECRET: ci-only-file-secret-not-used-in-any-real-environment
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: فحص الأنواع والبناء والاختبارات واختبارات المتصفح
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bluepoint
          POSTGRES_PASSWORD: bluepoint
          POSTGRES_DB: bluepoint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluepoint -d bluepoint_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci --no-audit --no-fund

      - name: توليد Prisma Client
        run: npx prisma generate

      - name: فحص الأنواع (TypeScript strict)
        run: npm run typecheck

      - name: بناء نسخة الإنتاج
        run: npm run build

      - name: تجهيز قاعدة بيانات الاختبار
        # migrate deploy غير تدميري + زرع البيانات المرجعية فقط (بدون بيانات تجريبية).
        run: npm run test:setup

      - name: تشغيل الاختبارات
        run: npm test

      # Chromium لازم لاختبارات المتصفح ولتوليد PDF فعلي. نثبّته عبر
      # playwright-core الموجود أصلًا في التبعيات — بلا حزمة إضافية.
      - name: تثبيت Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: اختبارات المتصفح (E2E)
        run: npm run test:e2e

      - name: التحقق من عدم تسرّب أسرار حقيقية
        run: |
          if git ls-files | grep -qx '.env'; then
            echo "✖ ملف .env مرفوع في المستودع — يجب أن يبقى محليًا فقط"
            exit 1
          fi
          echo "✓ لا يوجد ملف .env في المستودع"
